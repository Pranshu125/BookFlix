<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0b0c10" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b0c10" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b0c10" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Surface -->
    <linearGradient id="glassLinear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Text Glow -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="redFlix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3344" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>

    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="380" fill="url(#cyanOrb)" />
  <circle cx="980" cy="460" r="420" fill="url(#purpleOrb)" />

  <!-- Grid Accents -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Center Glass Card -->
  <rect x="120" y="75" width="960" height="480" rx="36" fill="url(#glassLinear)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#glassShadow)" />

  <!-- App Logo Emblem -->
  <g transform="translate(190, 140)">
    <rect width="84" height="84" rx="22" fill="#0c1017" stroke="rgba(56,189,248,0.5)" stroke-width="2" />
    <path d="M22 28 C28 24, 38 24, 42 27 C46 24, 56 24, 62 28 L62 58 C56 55, 46 55, 42 58 C38 55, 28 55, 22 58 Z" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="42" y1="27" x2="42" y2="58" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Brand Title -->
  <text x="295" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
    <tspan fill="#ffffff">BOOK</tspan><tspan fill="url(#redFlix)">FLIX</tspan>
  </text>
  <text x="540" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#38bdf8" letter-spacing="3">DIGITAL LIBRARY &amp; PWA</text>

  <!-- Main Value Proposition Heading -->
  <text x="190" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', sans-serif" font-weight="800" font-size="44" fill="url(#textGrad)" letter-spacing="-0.5">
    Read &amp; Stream Millions of Books,
  </text>
  <text x="190" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-0.5">
    Manga, Comics &amp; Audiobooks
  </text>

  <!-- Subtitle -->
  <text x="190" y="398" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="20" fill="rgba(226,232,240,0.76)">
    Zero-delay streaming reader • Liquid Claymorphism UI • 100% Free &amp; Offline Ready PWA
  </text>

  <!-- Feature Tags / Pills -->
  <g transform="translate(190, 440)">
    <!-- Pill 1: E-Books -->
    <rect x="0" y="0" width="135" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
    <text x="67" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="15" fill="#ffffff" text-anchor="middle">📖 E-Books</text>

    <!-- Pill 2: Manga -->
    <rect x="150" y="0" width="135" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
    <text x="217" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="15" fill="#ffffff" text-anchor="middle">🎌 Manga</text>

    <!-- Pill 3: Comics -->
    <rect x="300" y="0" width="135" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
    <text x="367" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="15" fill="#ffffff" text-anchor="middle">⚡ Comics</text>

    <!-- Pill 4: Audiobooks -->
    <rect x="450" y="0" width="155" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
    <text x="527" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="15" fill="#ffffff" text-anchor="middle">🎧 Audiobooks</text>

    <!-- Pill 5: Offline PWA -->
    <rect x="620" y="0" width="165" height="42" rx="21" fill="rgba(56,189,248,0.16)" stroke="rgba(56,189,248,0.4)" stroke-width="1.2" />
    <text x="702" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="15" fill="#38bdf8" text-anchor="middle">✨ Offline PWA</text>
  </g>
</svg>
